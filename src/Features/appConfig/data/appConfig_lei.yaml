orgaData:
  nom_NFX_46_020:
    importFromData: lei/nomenclatures/NFX_46_020.js
    url: https://public.storage.bimboxa.com/lei/orgaData/_nomenclature_nfx-46-020_v1.json

sync:
  canSyncLocalProject: false
  canSyncLocalScope: true

# FEATURES

features:
  krto:
    extension: zip
  # Modules enabled by default for a scope without a scopeConfigs row,
  # besides the core Fonds de plan + Dessin; absent => core modules only.
  # One key per business object type: BUSINESS_OBJECTS (STANDARD),
  # BUSINESS_OBJECTS_<TYPE> for the other registry types.
  scopeConfig:
    defaultEnabledModuleKeys:
      - PHOTOS
      - PORTFOLIO
      - THREED
      - ZONES
      - BUSINESS_OBJECTS
  scopes:
    enabled: true
  entityModels: # used in create listing dialog
    keys:
      - baseMap
      - zone
      - material
      - sample
      - annotation
      #- issue
      - blueprint
  entityModelTypes: # used in left sidebar
    - type: BASE_MAP
      name: Fonds de plan
    - type: ZONE_ENTITY
      name: Pièces
    - type: MATERIAL_ENTITY
      name: Matériaux
    - type: LOCATED_ENTITY
      name: Listes d'annotations
    - type: BLUEPRINT
      name: Exports

  tools:
    - "SELECTION_PROPERTIES"
    - "ENTITY_ZONES"
    - "PDF_REPORT"
    - "TOOLS"
    - "PRINT"
    - "CHAT"
    - "NOTES_APP_SYNC"

  notesApp:
    enabled: true
    name: Krnet
    supabaseUrl: https://frzwonhocryktnfmkpjy.supabase.co
    supabaseAnonKey: sb_publishable__GSHgltAfdKkv-wyBhDFIA_UCrfgSZZ
    # Default location annotationTemplate created on a mapped "Ouvrages"
    # listing that has none: imported Krnet positions become the object's
    # MAIN annotation, drawn from this template (Label with leader stub).
    locationAnnotationTemplate:
      label: Étiquette
      drawingShape: LABEL
      fillColor: *blue700
      labelStubLength: 32
      labelStubMode: FIXED

  annotationTemplatesLibraries:
    keywordsGroups:
      - type

  # Compact creation dialog: only the "Diag amiante - NFX_46_020" preset,
  # no built-in "Mission vide" / "Mission générique" entries.
  krtoConfigurations:
    enabled: true
    simpleModeKeys:
      - DIAG_AMIANTE_INIT
      - preset1

  scopeCreator:
    simpleMode:
      showEmpty: false
      showGeneric: false
      presetScopeKeys:
        - preset1

  presetScopes:
    fromAnnotationTemplatesLibraries: true
    items:
      - key: REPERAGE_GENERIQUE
        label: Repérage générique
        annotationTemplateKeys:
          - DEFAULT

  chat:
    agentDataManager:
      baseUrl: https://worker-agent-data-manager.antoine-e46.workers.dev

  portfolios:
    logoDefault:
      path: assets/logo.png

  bgImages:
    options:
      - key: BASIC
        urlFromAssetKey: bg_image_default
        name: "A4 - 150dpi"
        width: 1740
        height: 1240
        bbox: [70, 70, 1670, 1170]
        isDefault: true
      - key: DEFAULT
        urlFromAssetKey: bg_image_A4_150dpi
        name: "A4 - 150dpi - Cartouche LEI"
        width: 1740
        height: 1240
        bbox: [75, 215, 1600, 1100]

  annotations:
    spriteImages:
      - key: DEFAULT
        url: https://public.media.bimboxa.com/sprite_etandex_default.png
        columns: 3
        rows: 3
        tile: 64
        iconKeys:
          - circle
          - drop
          - ring
          - triangle
          - square
          - info
          - sun
          - clean
          - brush
